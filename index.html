<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagrama de Ishikawa — Análisis de causa raíz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');

  :root{
    --navy:#2D3277;
    --navy-dark:#20244F;
    --navy-panel:#373C86;
    --navy-panel-2:#454A9A;
    --yellow:#FFE600;
    --yellow-ink:#3A3400;
    --white:#FFFFFF;
    --text-dim:#C7C9EA;
    --text-faint:#9599CC;
    --danger:#FF6B5E;
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; background:var(--navy); color:var(--white); font-family:'Inter', sans-serif; min-height:100vh;}

  .wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 70px; }

  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:24px; }

  .brand-tag{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:0.06em; color:var(--navy); background:var(--yellow); padding:5px 12px; border-radius:20px; margin-bottom:16px; }

  h1{ font-weight:800; font-size:clamp(26px, 4vw, 36px); margin:0 0 8px; letter-spacing:-0.01em; }
  header p{ color:var(--text-dim); max-width:620px; line-height:1.55; margin:0; font-size:15px; }

  .export-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .export-btn{ display:inline-flex; align-items:center; gap:8px; background:var(--navy-panel); border:1px solid var(--navy-panel-2); color:var(--white); font-family:'Inter', sans-serif; font-weight:700; font-size:13px; padding:10px 16px; border-radius:10px; cursor:pointer; }
  .export-btn:hover{background:var(--navy-panel-2);}
  .export-btn.primary{ background:var(--yellow); color:var(--yellow-ink); border-color:var(--yellow); }
  .export-btn.primary:hover{opacity:0.9;}
  .export-hint{ flex-basis:100%; font-size:11.5px; color:var(--text-faint); margin:2px 0 0; max-width:420px; }

  .status{ position:fixed; top:16px; right:16px; font-size:12px; font-weight:500; background:var(--navy-panel); border:1px solid var(--navy-panel-2); padding:6px 12px; border-radius:20px; color:var(--text-dim); z-index:50; transition:opacity .3s; }

  .problema-box{ background:var(--navy-panel); border-radius:var(--radius); padding:20px 22px; margin-bottom:26px; }
  .problema-box label{ display:block; font-size:13px; font-weight:700; color:var(--yellow); margin-bottom:8px; }
  .problema-box textarea{ width:100%; background:transparent; border:none; border-bottom:1px solid var(--navy-panel-2); color:var(--white); font-family:'Inter', sans-serif; font-size:16px; padding:6px 0; resize:vertical; min-height:44px; }
  .problema-box textarea:focus{outline:none; border-bottom-color:var(--yellow);}

  .diagram-shell{ background:rgba(255,255,255,0.03); border-radius:var(--radius); padding:8px; overflow-x:auto; }
  svg{display:block; width:100%; min-width:760px; height:auto;}

  .bone-btn{ width:100%; height:100%; background:var(--navy-panel); border:1px solid var(--navy-panel-2); border-radius:10px; color:var(--white); font-family:'Inter', sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; padding:6px 8px; text-align:center; transition:background .15s, transform .1s; }
  .bone-btn:hover{background:var(--navy-panel-2);}
  .bone-btn:active{transform:scale(0.98);}
  .bone-btn .name{font-size:14px; font-weight:700;}
  .bone-btn .count{font-size:11px; color:var(--text-faint);}

  .head-box{ width:100%; height:100%; background:var(--yellow); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; justify-content:center; }
  .head-box .label{ font-size:12px; font-weight:800; color:var(--yellow-ink); margin-bottom:4px; letter-spacing:0.03em; }
  .head-box .txt{ font-size:13px; font-weight:500; color:var(--yellow-ink); line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; }
  .head-box .txt.empty{opacity:0.6; font-style:italic;}

  .legend{ margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; font-size:12.5px; color:var(--text-faint); }
  .legend span{ border:1px solid var(--navy-panel-2); border-radius:20px; padding:4px 10px; }

  .overlay{ position:fixed; inset:0; background:rgba(15,17,45,0.75); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .overlay.open{display:flex;}

  .panel{ background:var(--white); color:var(--navy-dark); border-radius:16px; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:26px 26px 30px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .panel-head h2{ font-size:21px; font-weight:800; margin:0; color:var(--navy); }
  .close-btn{ background:#F0F1FA; border:none; color:var(--navy); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px; flex-shrink:0; }
  .close-btn:hover{background:var(--yellow);}

  .guide-box{ background:#F5F6FC; border-left:4px solid var(--yellow); padding:12px 14px; border-radius:0 10px 10px 0; margin-bottom:20px; font-size:13.5px; line-height:1.55; color:#33355A; }
  .section-title{ font-size:14px; font-weight:700; color:var(--navy); margin:0 0 10px; }

  .causas-list{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:6px;}
  .causas-list li{ display:flex; align-items:center; gap:8px; background:#F5F6FC; border-radius:8px; padding:8px 10px; font-size:13.5px; }
  .causas-list li span{flex:1; line-height:1.4;}
  .causas-list li button{ background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:13px; font-weight:600; }

  .add-row{display:flex; gap:8px; margin-bottom:26px;}
  .add-row input{ flex:1; background:#F5F6FC; border:1px solid #E1E3F5; border-radius:8px; padding:9px 10px; color:var(--navy-dark); font-size:13.5px; font-family:'Inter', sans-serif; }
  .add-row button{ background:var(--yellow); color:var(--yellow-ink); border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy-panel); border:1px solid var(--yellow); color:var(--white); padding:10px 18px; border-radius:20px; font-size:13px; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show{opacity:1;}

  #printReport{display:none;}

  /* CONFIGURACIÓN EXCLUSIVA DE IMPRESIÓN (PDF) */
  @media print{
    @page { size: landscape; margin: 10mm; }
    * { -webkit-print-color-adjust: exact !important; color-adjust: exact !important; print-color-adjust: exact !important; }
    html, body { background: #FFFFFF !important; min-height: 0 !important; height: auto !important; margin: 0 !important; }

    /* Ocultar TODO el contenido de pantalla con display:none (no solo visibility)
       para que no siga ocupando espacio y genere una página extra en blanco. */
    .status, .wrap, .overlay, .toast { display: none !important; }
    #printReport { display: block; background: #FFFFFF; color: #20244F; }

    .pr-page { padding: 4px 10px; page-break-after: avoid; page-break-inside: avoid; }
    .pr-title { font-size: 20px; font-weight: 800; color: #2D3277; margin: 0 0 6px; }

    /* Contenedor con relación de aspecto fija (truco padding-top, compatible con todo motor de impresión) */
    .pr-diagram { position: relative; width: 100%; height: 0; padding-top: 56.667%; }
    .pr-diagram svg{ position:absolute !important; inset:0; width:100% !important; height:100% !important; min-width:0 !important; display:block; }

    .pr-cat-card{ position:absolute; box-sizing:border-box; display:flex; flex-direction:column; padding:2px 8px; font-family:'Inter',sans-serif; }
    .pr-cat-card.bottom{ justify-content:flex-end; }
    .pr-cat-title{ font-size:13px; font-weight:800; color:#2D3277; margin:0 0 3px; }
    .pr-cat-card.bottom .pr-cat-title{ margin:3px 0 0; }
    .pr-cat-list{ margin:0; padding:0; list-style:none; }
    .pr-cat-list li{ font-size:10.5px; line-height:1.35; color:#33355A; }
    .pr-cat-empty{ font-size:10.5px; font-style:italic; color:#9599CC; margin:0; }

    .pr-problem-box{ position:absolute; box-sizing:border-box; border:2px solid #2D3277; border-radius:10px; background:#FFFFFF; padding:6px 10px; display:flex; flex-direction:column; justify-content:center; font-family:'Inter',sans-serif; }
    .pr-problem-label{ font-size:11px; font-weight:800; color:#2D3277; letter-spacing:0.04em; margin:0 0 4px; }
    .pr-problem-text{ font-size:12px; color:#20244F; line-height:1.35; margin:0; }
  }
</style>
</head>
<body>

<div class="status" id="statusTag">Cargando…</div>

<div class="wrap">
  <div class="topbar">
    <header>
      <div class="brand-tag">SHE · Análisis de causa raíz</div>
      <h1>Diagrama de Ishikawa</h1>
      <p>Explora cada rama para registrar las causas. Todo se guarda automáticamente.</p>
    </header>
    <div class="export-actions">
      <button class="export-btn" id="btnPdf" type="button">Exportar a PDF</button>
      <button class="export-btn primary" id="btnPptx" type="button">Exportar a Google Slides / PPTX</button>
    </div>
    <p class="export-hint" id="exportHint">La exportación a PPTX requiere conexión a internet la primera vez.</p>
  </div>

  <div class="problema-box">
    <label>Efecto / problema a analizar</label>
    <textarea id="problemaInput" placeholder="Describe qué ocurre, dónde, cuándo y con qué magnitud."></textarea>
  </div>

  <div class="diagram-shell">
    <svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
      <line x1="150" y1="320" x2="990" y2="320" stroke="var(--yellow)" stroke-width="3"/>
      <path d="M150,320 L75,270 M150,320 L75,370" stroke="var(--yellow)" stroke-width="2.5" fill="none"/>
      <line x1="280" y1="320" x2="170" y2="150" stroke="var(--navy-panel-2)" stroke-width="2"/>
      <line x1="520" y1="320" x2="410" y2="150" stroke="var(--navy-panel-2)" stroke-width="2"/>
      <line x1="760" y1="320" x2="650" y2="150" stroke="var(--navy-panel-2)" stroke-width="2"/>
      <line x1="280" y1="320" x2="170" y2="490" stroke="var(--navy-panel-2)" stroke-width="2"/>
      <line x1="520" y1="320" x2="410" y2="490" stroke="var(--navy-panel-2)" stroke-width="2"/>
      <line x1="760" y1="320" x2="650" y2="490" stroke="var(--navy-panel-2)" stroke-width="2"/>
      <line x1="990" y1="320" x2="1010" y2="320" stroke="var(--yellow)" stroke-width="3"/>

      <foreignObject x="70" y="105" width="200" height="88">
        <div xmlns="http://www.w3.org/1999/xhtml"><button class="bone-btn" data-cat="mano_obra" type="button"><span class="name">Mano de obra</span><span class="count" data-count="mano_obra">0 causas</span></button></div>
      </foreignObject>
      <foreignObject x="310" y="105" width="200" height="88">
        <div xmlns="http://www.w3.org/1999/xhtml"><button class="bone-btn" data-cat="metodo" type="button"><span class="name">Método</span><span class="count" data-count="metodo">0 causas</span></button></div>
      </foreignObject>
      <foreignObject x="550" y="105" width="200" height="88">
        <div xmlns="http://www.w3.org/1999/xhtml"><button class="bone-btn" data-cat="maquinaria" type="button"><span class="name">Maquinaria</span><span class="count" data-count="maquinaria">0 causas</span></button></div>
      </foreignObject>
      <foreignObject x="70" y="447" width="200" height="88">
        <div xmlns="http://www.w3.org/1999/xhtml"><button class="bone-btn" data-cat="material" type="button"><span class="name">Material</span><span class="count" data-count="material">0 causas</span></button></div>
      </foreignObject>
      <foreignObject x="310" y="447" width="200" height="88">
        <div xmlns="http://www.w3.org/1999/xhtml"><button class="bone-btn" data-cat="medicion" type="button"><span class="name">Medición</span><span class="count" data-count="medicion">0 causas</span></button></div>
      </foreignObject>
      <foreignObject x="550" y="447" width="200" height="88">
        <div xmlns="http://www.w3.org/1999/xhtml"><button class="bone-btn" data-cat="medio_ambiente" type="button"><span class="name">Medio ambiente</span><span class="count" data-count="medio_ambiente">0 causas</span></button></div>
      </foreignObject>
      <foreignObject x="1000" y="230" width="185" height="180">
        <div xmlns="http://www.w3.org/1999/xhtml" class="head-box"><div class="label">EFECTO</div><div class="txt empty" id="headPreview">Sin definir todavía</div></div>
      </foreignObject>
    </svg>
  </div>

  <div class="legend"><span>Clic en una rama para documentar causas.</span></div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle">Categoría</h2>
      <button class="close-btn" id="closeBtn" type="button">✕</button>
    </div>

    <p class="section-title">Causas identificadas</p>
    <ul class="causas-list" id="causasList"></ul>
    <div class="add-row">
      <input type="text" id="causaInput" placeholder="Describe una causa específica...">
      <button id="addCausaBtn" type="button">Agregar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Contenedor dedicado únicamente a la renderización del PDF -->
<div id="printReport"></div>

<script>
  function loadScriptOnce(src, timeoutMs){
    timeoutMs = timeoutMs || 8000;
    return new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-src="' + src + '"]');
      // Si ya se cargó bien antes, no hay nada que hacer.
      if (existing && existing.dataset.loaded === "true"){ resolve(); return; }
      // Si existe pero quedó a medias (falló o se atascó en un intento previo),
      // hay que quitarlo: sus eventos load/error ya se dispararon una vez y
      // nunca volverán a hacerlo, lo que dejaba la promesa colgada para siempre.
      if (existing) existing.remove();

      const s = document.createElement('script');
      s.src = src;
      s.dataset.src = src;

      const timer = setTimeout(() => {
        s.remove();
        reject(new Error("Tiempo de espera agotado al cargar " + src));
      }, timeoutMs);

      s.onload = () => { clearTimeout(timer); s.dataset.loaded = "true"; resolve(); };
      s.onerror = () => { clearTimeout(timer); s.remove(); reject(new Error("No se pudo descargar " + src)); };
      document.head.appendChild(s);
    });
  }

  async function ensurePptxLib(){
    if (typeof PptxGenJS !== "undefined") return;
    const sources = [
      "https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js",
      "https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js",
      "https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"
    ];
    let lastError = null;
    for (const src of sources){
      try{
        await loadScriptOnce(src);
        if (typeof PptxGenJS !== "undefined") return;
      } catch(e){ lastError = e; }
    }
    throw lastError || new Error("No se pudo cargar la librería PPTX");
  }

  const CATS = {
    mano_obra: { nombre: "Mano de obra" },
    metodo: { nombre: "Método" },
    maquinaria: { nombre: "Maquinaria" },
    material: { nombre: "Material" },
    medicion: { nombre: "Medición" },
    medio_ambiente: { nombre: "Medio ambiente" }
  };

  const STORAGE_KEY = "fishbone:data";
  let state = { problema: "", categorias: {} };
  Object.keys(CATS).forEach(k => { state.categorias[k] = { causas: [] }; });

  let currentCat = null;
  const statusTag = document.getElementById("statusTag");
  const toast = document.getElementById("toast");

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
  }

  function setStatus(text, fade){
    statusTag.textContent = text;
    statusTag.style.opacity = "1";
    if (fade){ setTimeout(() => { statusTag.style.opacity = "0"; }, 1400); }
  }

  function loadState(){
    try{
      const resValue = localStorage.getItem(STORAGE_KEY);
      if (resValue){
        const parsed = JSON.parse(resValue);
        state.problema = parsed.problema || "";
        Object.keys(CATS).forEach(k => {
          if (parsed.categorias && parsed.categorias[k]){
            state.categorias[k] = {
              causas: parsed.categorias[k].causas || []
            };
          }
        });
      }
      setStatus("Datos cargados", true);
    }catch(e){
      setStatus("Nuevo diagrama", true);
    }
    document.getElementById("problemaInput").value = state.problema;
    renderHead();
    renderCounts();
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setStatus("Guardado", true);
    }catch(e){
      showToast("No se pudo guardar. Elimina algunas causas e inténtalo de nuevo.");
    }
  }

  function renderHead(){
    const el = document.getElementById("headPreview");
    if (state.problema.trim()){
      el.textContent = state.problema; el.classList.remove("empty");
    } else {
      el.textContent = "Sin definir todavía"; el.classList.add("empty");
    }
  }

  function renderCounts(){
    Object.keys(CATS).forEach(k => {
      const c = state.categorias[k];
      const el = document.querySelector('[data-count="' + k + '"]');
      if (el){ el.textContent = `${c.causas.length} causas`; }
    });
  }

  document.getElementById("problemaInput").addEventListener("input", (e) => { state.problema = e.target.value; renderHead(); });
  document.getElementById("problemaInput").addEventListener("change", saveState);

  document.querySelectorAll(".bone-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentCat = btn.getAttribute("data-cat");
      document.getElementById("panelTitle").textContent = CATS[currentCat].nombre;
      renderCausas();
      document.getElementById("overlay").classList.add("open");
    });
  });

  const closePanel = () => { document.getElementById("overlay").classList.remove("open"); currentCat = null; };
  document.getElementById("closeBtn").addEventListener("click", closePanel);

  function renderCausas(){
    const list = document.getElementById("causasList");
    list.innerHTML = "";
    if(!state.categorias[currentCat].causas.length){
      list.innerHTML = '<li style="color:#9599CC; font-style:italic; background:transparent;">Sin causas.</li>';
      return;
    }
    state.categorias[currentCat].causas.forEach((texto, idx) => {
      const li = document.createElement("li");
      li.innerHTML = `<span>${texto}</span><button type="button" title="Eliminar">✕</button>`;
      li.querySelector("button").onclick = () => {
        state.categorias[currentCat].causas.splice(idx, 1);
        saveState(); renderCausas(); renderCounts();
      };
      list.appendChild(li);
    });
  }

  document.getElementById("addCausaBtn").addEventListener("click", () => {
    const input = document.getElementById("causaInput");
    if (input.value.trim() && currentCat) {
      state.categorias[currentCat].causas.push(input.value.trim());
      input.value = ""; saveState(); renderCausas(); renderCounts();
    }
  });

  // Coordenadas compartidas del diagrama (mismo sistema para PDF y PPTX)
  const FISHBONE_LAYOUT = {
    viewW: 1200, viewH: 680,
    spineY: 340, spineX1: 250, spineX2: 985,
    boxW: 220, boxH: 150,
    topY: 40, botY: 490,
    cols: [170, 410, 650], // centro de columna: mano_obra/material, metodo/medicion, maquinaria/medio_ambiente
    topKeys: ["mano_obra", "metodo", "maquinaria"],
    botKeys: ["material", "medicion", "medio_ambiente"],
    problem: { x: 1015, y: 245, w: 170, h: 190 }
  };

  function getCatBox(key){
    const L = FISHBONE_LAYOUT;
    let idx = L.topKeys.indexOf(key), isBottom = false;
    if (idx === -1){ idx = L.botKeys.indexOf(key); isBottom = true; }
    const colCenter = L.cols[idx];
    return {
      colCenter,
      boxX: colCenter - L.boxW / 2,
      boxY: isBottom ? L.botY : L.topY,
      boxW: L.boxW, boxH: L.boxH,
      spineX: colCenter + 110,
      isBottom
    };
  }

  function allCatKeys(){
    const L = FISHBONE_LAYOUT;
    return [
      ...L.topKeys.map(k => ({ k, bottom: false })),
      ...L.botKeys.map(k => ({ k, bottom: true }))
    ];
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  }

  // Construye el diagrama para el PDF: SVG solo con líneas + texto en divs HTML superpuestos
  // (nada de texto dentro de <foreignObject>, para que se vea siempre al imprimir).
  function buildPrintDiagramHTML(){
    const L = FISHBONE_LAYOUT;
    let linesSVG = `<line x1="${L.spineX1}" y1="${L.spineY}" x2="${L.spineX2}" y2="${L.spineY}" stroke="#2D3277" stroke-width="4"/>` +
      `<polygon points="${L.spineX2},${L.spineY-16} ${L.spineX2+30},${L.spineY} ${L.spineX2},${L.spineY+16}" fill="#2D3277"/>`;

    let overlays = "";
    allCatKeys().forEach(({ k, bottom }) => {
      const b = getCatBox(k);
      const yEnd = bottom ? b.boxY : (b.boxY + b.boxH);
      linesSVG += `<line x1="${b.spineX}" y1="${L.spineY}" x2="${b.colCenter}" y2="${yEnd}" stroke="#454A9A" stroke-width="2.5"/>`;

      const left = (b.boxX / L.viewW * 100).toFixed(3);
      const top = (b.boxY / L.viewH * 100).toFixed(3);
      const width = (b.boxW / L.viewW * 100).toFixed(3);
      const height = (b.boxH / L.viewH * 100).toFixed(3);

      const cat = state.categorias[k];
      const listHTML = cat.causas.length
        ? `<ul class="pr-cat-list">${cat.causas.map(c => `<li>${escapeHtml(c)}</li>`).join("")}</ul>`
        : `<p class="pr-cat-empty">Sin causas registradas.</p>`;
      const titleHTML = `<div class="pr-cat-title">${escapeHtml(CATS[k].nombre)}</div>`;
      const inner = bottom ? (listHTML + titleHTML) : (titleHTML + listHTML);

      overlays += `<div class="pr-cat-card${bottom ? " bottom" : ""}" style="left:${left}%; top:${top}%; width:${width}%; height:${height}%;">${inner}</div>`;
    });

    const pb = L.problem;
    const pbLeft = (pb.x / L.viewW * 100).toFixed(3);
    const pbTop = (pb.y / L.viewH * 100).toFixed(3);
    const pbW = (pb.w / L.viewW * 100).toFixed(3);
    const pbH = (pb.h / L.viewH * 100).toFixed(3);
    overlays += `<div class="pr-problem-box" style="left:${pbLeft}%; top:${pbTop}%; width:${pbW}%; height:${pbH}%;">
      <p class="pr-problem-label">PROBLEMA</p>
      <p class="pr-problem-text">${escapeHtml(state.problema || "Sin definir")}</p>
    </div>`;

    return `<div class="pr-diagram">
      <svg viewBox="0 0 ${L.viewW} ${L.viewH}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">${linesSVG}</svg>
      ${overlays}
    </div>`;
  }

  // EXPORTAR A PDF (una sola página, sin fotos, causas desglosadas debajo de cada M)
  document.getElementById("btnPdf").addEventListener("click", () => {
    const printDiv = document.getElementById("printReport");
    const page = document.createElement("div");
    page.className = "pr-page";
    page.innerHTML = `<h2 class="pr-title">Diagrama de Ishikawa — Análisis de causa raíz</h2>${buildPrintDiagramHTML()}`;
    printDiv.innerHTML = "";
    printDiv.appendChild(page);
    window.print();
  });

  // EXPORTAR A PPTX (mismo diseño que el PDF: espina, huesos, recuadro de problema
  // y causas desglosadas debajo de cada M, todo en una sola diapositiva, sin fotos)
  document.getElementById("btnPptx").addEventListener("click", async () => {
    if (navigator.onLine === false) {
      showToast("Sin conexión a internet. Conéctate e inténtalo de nuevo.");
      setStatus("Sin conexión", true);
      return;
    }

    setStatus("Preparando presentación...", false);
    document.getElementById("btnPptx").disabled = true;
    
    try {
      await ensurePptxLib();

      const L = FISHBONE_LAYOUT;
      const offX = 0.35, offY = 0.75;
      const scaleX = 9.3 / L.viewW;
      const scaleY = (5.63 - offY - 0.1) / L.viewH;
      const toX = v => offX + v * scaleX;
      const toY = v => offY + v * scaleY;
      const toW = v => v * scaleX;
      const toH = v => v * scaleY;

      let pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';

      let slide = pptx.addSlide();
      slide.background = { color: "FFFFFF" };

      slide.addText("Diagrama de Ishikawa — Análisis de causa raíz", {
        x: offX, y: 0.2, w: 9.3, h: 0.4, fontSize: 17, bold: true, color: "2D3277"
      });

      // Espina central con flecha hacia el recuadro de problema
      slide.addShape(pptx.ShapeType.line, {
        x: toX(L.spineX1), y: toY(L.spineY), w: toW(L.spineX2 - L.spineX1), h: 0,
        line: { color: "2D3277", width: 2.5, endArrowType: "triangle" }
      });

      // Huesos diagonales + tarjetas de causas debajo de cada M
      allCatKeys().forEach(({ k, bottom }) => {
        const b = getCatBox(k);
        const yEdge = bottom ? b.boxY : (b.boxY + b.boxH);
        const y1 = Math.min(yEdge, L.spineY), y2 = Math.max(yEdge, L.spineY);

        slide.addShape(pptx.ShapeType.line, {
          x: toX(b.colCenter), y: toY(y1), w: toW(110), h: toH(y2 - y1),
          flipV: bottom,
          line: { color: "454A9A", width: 1.5 }
        });

        const cat = state.categorias[k];
        const causaParas = cat.causas.length
          ? cat.causas.map(c => ({ text: c, options: { bullet: true, color: "33355A", fontSize: 10, breakLine: true } }))
          : [{ text: "Sin causas registradas.", options: { italic: true, color: "9599CC", fontSize: 10, breakLine: true } }];
        const titlePara = { text: CATS[k].nombre, options: { bold: true, color: "2D3277", fontSize: 12.5, breakLine: true } };
        const paras = bottom ? [...causaParas, titlePara] : [titlePara, ...causaParas];

        slide.addText(paras, {
          x: toX(b.boxX), y: toY(b.boxY), w: toW(b.boxW), h: toH(b.boxH),
          valign: bottom ? "bottom" : "top"
        });
      });

      // Recuadro de problema
      const pb = L.problem;
      slide.addShape(pptx.ShapeType.roundRect, {
        x: toX(pb.x), y: toY(pb.y), w: toW(pb.w), h: toH(pb.h),
        fill: { color: "FFFFFF" }, line: { color: "2D3277", width: 1.5 }, rectRadius: 0.08
      });
      slide.addText([
        { text: "PROBLEMA", options: { bold: true, color: "2D3277", fontSize: 10, breakLine: true } },
        { text: state.problema || "Sin definir", options: { color: "20244F", fontSize: 11 } }
      ], { x: toX(pb.x) + 0.1, y: toY(pb.y), w: toW(pb.w) - 0.2, h: toH(pb.h), valign: "middle" });
      
      await pptx.writeFile({ fileName: "Diagrama_Ishikawa.pptx" });
      setStatus("Exportado con éxito", true);
    } catch (error) {
      console.error(error);
      showToast("Error. Revisa tu conexión a internet o desactiva tu bloqueador de anuncios.");
      setStatus("Error de red", true);
    } finally {
      document.getElementById("btnPptx").disabled = false;
    }
  });

  loadState();
</script>
</body>
</html>
